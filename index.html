<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東陽町ランチ候補</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.card{
    background:white;
    margin:16px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.header{
    padding:16px;
    font-size:24px;
    font-weight:bold;
}

iframe{
    width:100%;
    height:500px;
    border:none;
}

.fallback{
    padding:16px;
}

a{
    color:#0066cc;
}
</style>
</head>

<body>

<div class="card">
    <div class="header">
        Park Community KIBACO
    </div>

    <iframe
        src="https://park-community-kibaco.com/cafe/">
    </iframe>

    <div class="fallback">
        iframeが表示されない場合：
        <br><br>
        <a href="https://park-community-kibaco.com/cafe/" target="_blank">
            KIBACO公式サイト
        </a>
    </div>
</div>

<div class="card">
    <div class="header">
        goodcoffee 東陽町
    </div>

    <iframe
        src="https://coool.cafe/cafe/goodcoffee-%E6%9D%B1%E9%99%BD%E7%94%BA-by-goodroom-tokyo">
    </iframe>

    <div class="fallback">
        <a href="https://coool.cafe/cafe/goodcoffee-%E6%9D%B1%E9%99%BD%E7%94%BA-by-goodroom-tokyo" target="_blank">
            goodcoffee紹介ページ
        </a>
    </div>
</div>

</body>
</html>
